server:
  # 0.0.0.0 permite conectar un teléfono físico de la misma red. Para usar solo el emulador
  # o el propio PC, define SERVER_ADDRESS=127.0.0.1
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  servlet:
    context-path: /api
spring:
  datasource:
    url: jdbc:h2:mem:sanaesencia;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      # La consola H2 da acceso completo a la base de datos: apagada por defecto.
      enabled: ${H2_CONSOLE_ENABLED:false}
app:
  jwt:
    # Clave de firma de los tokens. Nunca se guarda en el repositorio: se entrega con la variable
    # JWT_SECRET (mínimo 32 caracteres). Vacía = clave aleatoria en cada arranque (desarrollo).
    secret: ${JWT_SECRET:}
    # Duración de la sesión: 8 horas
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  login:
    # Intentos fallidos permitidos por cuenta e IP antes de bloquear el login temporalmente
    max-intentos: 5
    bloqueo-minutos: 15
  demo:
    # Crea las cuentas de demostración (contraseñas públicas). En producción: APP_DEMO_SEED=false
    seed: ${APP_DEMO_SEED:true}
  desercion:
    dias-inactividad: 21
  # RF-14: credenciales oficiales de MEDIlink (vacías hasta que el centro las entregue).
  medilink:
    base-url: ${MEDILINK_BASE_URL:}
    citas-path: ${MEDILINK_CITAS_PATH:}
    api-key: ${MEDILINK_API_KEY:}
