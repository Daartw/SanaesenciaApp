# Perfil MySQL. Los valores por defecto coinciden con docker-compose.yml (solo desarrollo local);
# en cualquier otro entorno entrega DB_URL, DB_USER y DB_PASSWORD como variables de entorno
# y usa una conexión cifrada (useSSL=true).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sanaesencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:sanaesencia}
    password: ${DB_PASSWORD:sanaesencia}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
