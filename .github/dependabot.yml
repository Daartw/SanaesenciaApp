# Revisa cada semana si hay versiones nuevas (con parches de seguridad) de las dependencias
version: 2
updates:
  - package-ecosystem: gradle
    directory: /SanaesenciaBackend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /SanaesenciaApp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OkHttp 5 exige compileSdk 37 y Android Gradle Plugin 9. Revisar al migrar a AGP 9.
      - dependency-name: com.squareup.okhttp3:*
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
