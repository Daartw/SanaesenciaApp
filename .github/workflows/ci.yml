name: CI

on:
  push:
    # deps/** permite validar actualizaciones grandes en una rama antes de llevarlas a main
    branches: [main, "deps/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SanaesenciaBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Verifica además que gradle-wrapper.jar sea el oficial
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-report
          path: SanaesenciaBackend/build/reports/tests/test

  android:
    name: App Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SanaesenciaApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
